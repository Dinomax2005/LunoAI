name: Deploy Luno to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep `dist` the single source of truth for the site.
      #
      # This repo's Pages setting still points at a legacy "deploy from a branch"
      # source - a /docs folder on a stale branch that no longer exists. GitHub's
      # legacy pages-build-deployment publisher therefore races this workflow and
      # could replace a good deploy with an empty site.
      #
      # Best effort only. GITHUB_TOKEN is granted `pages: write`, which covers
      # Pages *deployments* but not Pages *site configuration*: GitHub answers this
      # PUT with 403 "Resource not accessible by integration" (verified in run
      # 38895690801). Until a maintainer flips
      # Settings > Pages > Build and deployment > Source to "GitHub Actions" once,
      # this step leaves a warning annotation on every run as a reminder and then
      # no-ops forever after. It never fails the deploy.
      - name: Point GitHub Pages at this workflow
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Accept: application/vnd.github+json"
                -H "Authorization: Bearer ${GITHUB_TOKEN}"
                -H "X-GitHub-Api-Version: 2022-11-28")

          current=$(curl -sfL "${auth[@]}" "$api" | jq -r '.build_type // "unknown"' || echo unknown)
          echo "Current Pages build_type: ${current}"

          if [ "${current}" = "workflow" ]; then
            echo "Pages already builds via GitHub Actions - nothing to change."
            exit 0
          fi

          if curl -sfL -X PUT "${auth[@]}" "$api" -d '{"build_type":"workflow"}' > /dev/null; then
            echo "Switched Pages to GitHub Actions; dist/ is now the published source."
          else
            echo "::warning title=GitHub Pages source::Could not switch Pages to GitHub Actions automatically. Do it once by hand: Settings > Pages > Build and deployment > Source > GitHub Actions."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
